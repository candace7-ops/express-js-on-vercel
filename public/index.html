<script>
  const tickerEl = document.getElementById("ticker");
  const runBtn = document.getElementById("runBtn");
  const outputEl = document.getElementById("output");
  const redditLinkEl = document.getElementById("redditLink");

  function normTicker(s) {
    return (s || "").trim().toUpperCase();
  }

  function setRedditLink(ticker) {
    const q = `$${ticker} OR ${ticker}`;
    redditLinkEl.href = `https://www.reddit.com/search/?q=${encodeURIComponent(q)}&sort=new`;
  }

  // NEW: timestamp parsing helper
  function parseTsToMs(ts) {
    if (!ts) return null;
    if (typeof ts === "number") return ts;
    const n = Number(ts);
    if (!Number.isNaN(n)) return n; // handles ms stored as string
    const d = new Date(ts);
    const ms = d.getTime();
    return Number.isNaN(ms) ? null : ms;
  }

  runBtn.addEventListener("click", async () => {
    const ticker = normTicker(tickerEl.value);
    if (!ticker) {
      outputEl.textContent = "Please enter a ticker (example: AAPL).";
      return;
    }

    setRedditLink(ticker);

    runBtn.disabled = true;
    outputEl.textContent = "Loading...";

    const lastKey = `stockspade:lastChecked:${ticker}`;

    // CHANGED: store as milliseconds (number) for easy comparison
    const lastCheckedRaw = localStorage.getItem(lastKey);
    const lastCheckedMs = lastCheckedRaw ? Number(lastCheckedRaw) : null;
    const lastCheckedLabel =
      lastCheckedMs && !Number.isNaN(lastCheckedMs)
        ? new Date(lastCheckedMs).toISOString()
        : (lastCheckedRaw || "never");

    try {
      const resp = await fetch(`/api/brief?ticker=${encodeURIComponent(ticker)}`);
      const data = await resp.json();

      if (!resp.ok) {
        outputEl.textContent = `Error: ${data.error || resp.statusText}`;
        return;
      }

      const headlines = Array.isArray(data.headlines) ? data.headlines : [];

      // NEW: filter headlines newer than lastChecked
      const newHeadlines = headlines.filter(h => {
        const hMs = parseTsToMs(h.ts);
        if (!hMs) return false;                 // if timestamp missing/unparseable, don't count as new
        if (!lastCheckedMs || Number.isNaN(lastCheckedMs)) return true; // first run => all are new
        return hMs > lastCheckedMs;
      });

      // CHANGED: update lastChecked AFTER successful fetch/render, store ms
      const nowMs = Date.now();
      localStorage.setItem(lastKey, String(nowMs));

      // NEW: human-readable “what’s new”
      let whatsNewText = "";
      if (!lastCheckedMs || Number.isNaN(lastCheckedMs)) {
        whatsNewText = "First time checking this ticker (everything is “new”).";
      } else if (newHeadlines.length === 0) {
        whatsNewText = `Nothing new since ${new Date(lastCheckedMs).toLocaleString()}.`;
      } else {
        whatsNewText =
          `${newHeadlines.length} new headline(s) since ${new Date(lastCheckedMs).toLocaleString()}:\n` +
          newHeadlines
            .map(h => `- [${h.ts}] ${h.title}\n  ${h.url}`)
            .join("\n");
      }

      outputEl.textContent =
        `Ticker: ${data.ticker}\n` +
        `Generated: ${data.generatedAt}\n` +
        `Last checked (before this): ${lastCheckedLabel}\n\n` +
        `What's new since last check:\n` +
        `${whatsNewText}\n\n` +
        `30-second brief:\n${data.brief30s}\n\n` +
        `Headlines:\n` +
        headlines.map(h => `- [${h.ts}] ${h.title}\n  ${h.url}`).join("\n") +
        `\n\n---\nReddit pulse\nOpen: ${redditLinkEl.href}\n`;
    } catch (err) {
      outputEl.textContent = `Network error: ${String(err)}`;
    } finally {
      runBtn.disabled = false;
    }
  });

  tickerEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") runBtn.click();
  });
</script>
